name: Preview Setwerk minimal Focus
on:
  push:
    branches: [preview/minimal-focus-20261020]
permissions:
  contents: read
concurrency:
  group: setwerk-minimal-focus-preview
  cancel-in-progress: true
jobs:
  preview:
    if: github.ref == 'refs/heads/preview/minimal-focus-20261020'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check website and Android application behavior
        run: npm ci && npm test && npm run test:android
      - name: Install Chromium for mobile interaction checks
        run: npm install --prefix .preview-tools --no-package-lock --ignore-scripts playwright@1.62.1 && .preview-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Check minimal Focus, music dock, unit conversion and tab gestures
        env:
          NODE_PATH: ${{ github.workspace }}/.preview-tools/node_modules
        run: node scripts/focus-controls-browser-check.cjs
      - name: Retain Focus screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: setwerk-focus-controls-review
          path: ${{ runner.temp }}/setwerk-focus-controls
          if-no-files-found: ignore
      - name: Create Firebase preview for review
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SETWERK_CB1E0 }}
          projectId: setwerk-cb1e0
          channelId: minimal-focus
          expires: 7d
          entryPoint: .
