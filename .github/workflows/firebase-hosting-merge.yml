name: Deploy Setwerk to Firebase Hosting

on:
  push:
    branches:
      - firebase-migration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: setwerk-firebase-live
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/firebase-migration'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the website
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Run application tests
        run: |
          npm ci
          npm test

      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Firebase test tools
        run: npm install --prefix .firebase-test --no-package-lock --ignore-scripts firebase@12.4.0 @firebase/rules-unit-testing@5.0.0 firebase-tools@14.20.0 playwright@1.62.1

      - name: Test Firebase authentication and private database rules
        env:
          NODE_PATH: ${{ github.workspace }}/.firebase-test/node_modules
        run: .firebase-test/node_modules/.bin/firebase emulators:exec --only firestore,auth --project demo-setwerk "node --test --test-concurrency=1 firebase/tests/*.test.cjs"

      - name: Install browser for UI checks
        run: .firebase-test/node_modules/.bin/playwright install --with-deps chromium

      - name: Check desktop and mobile account settings in Chromium
        env:
          NODE_PATH: ${{ github.workspace }}/.firebase-test/node_modules
        run: node scripts/account-browser-check.cjs

      - name: Keep account settings screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: setwerk-account-ui
          path: ${{ runner.temp }}/setwerk-ui
          if-no-files-found: ignore

      - name: Check Firebase deployment credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SETWERK_CB1E0 }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Missing GitHub Actions secret FIREBASE_SERVICE_ACCOUNT_SETWERK_CB1E0. Run firebase init hosting:github --project setwerk-cb1e0 for markuskep/Setwerk."
            exit 1
          fi

      - name: Configure Firebase authentication and private storage
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SETWERK_CB1E0 }}
        run: node firebase/setup-project.mjs

      - name: Verify browser Firebase SDK files
        run: |
          node --input-type=module -e "for (const name of ['app','auth','firestore']) { const response = await fetch('https://www.gstatic.com/firebasejs/12.4.0/firebase-'+name+'.js'); if (!response.ok) throw Error('Firebase SDK unavailable: '+name); }"

      - name: Publish Setwerk to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SETWERK_CB1E0 }}
          projectId: setwerk-cb1e0
          channelId: live
          entryPoint: .

