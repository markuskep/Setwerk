# Build from the repository root so Netlify installs the Function dependency.
[build]
  command = "node --check netlify/functions/workout-store.mjs"
  publish = "Setwerk-Webapp-1.2.0-Projektdateien/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
